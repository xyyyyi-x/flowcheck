[project]
name = "flowcheck-api"
version = "0.1.0"
description = "FlowCheck API regression testing platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.6,<6",
    "redis>=5,<8",
    "packaging>=24",
    "httpx>=0.28,<1",
    "pyjwt>=2.8,<3",
    "pwdlib[argon2]>=0.2,<1",
    "cryptography>=43",
    "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI 的依赖注入约定使用函数调用作为参数默认值。
ignore = ["B008"]
