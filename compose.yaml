name: arp-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arp}
      POSTGRES_USER: ${POSTGRES_USER:-arp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - arp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arp} -d ${POSTGRES_DB:-arp}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_SYNC_DATABASE_URL: ${APP_SYNC_DATABASE_URL:?APP_SYNC_DATABASE_URL is required}
      APP_REDIS_BROKER_URL: ${APP_REDIS_BROKER_URL:?APP_REDIS_BROKER_URL is required}
      APP_REDIS_CACHE_URL: ${APP_REDIS_CACHE_URL:?APP_REDIS_CACHE_URL is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      TARGET_ORIGINS: ${TARGET_ORIGINS:?TARGET_ORIGINS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_SYNC_DATABASE_URL: ${APP_SYNC_DATABASE_URL:?APP_SYNC_DATABASE_URL is required}
      APP_REDIS_BROKER_URL: ${APP_REDIS_BROKER_URL:?APP_REDIS_BROKER_URL is required}
      APP_REDIS_CACHE_URL: ${APP_REDIS_CACHE_URL:?APP_REDIS_CACHE_URL is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      TARGET_ORIGINS: ${TARGET_ORIGINS:?TARGET_ORIGINS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  demo-api:
    build:
      context: ./demo-api
      dockerfile: Dockerfile
    environment:
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD is required}
      DEMO_FAULT_MODE: ${DEMO_FAULT_MODE:-}
      DEMO_WRITE_DELAY_S: ${DEMO_WRITE_DELAY_S:-0}
      DEMO_DB_PATH: /data/demo.db
    volumes:
      - demo-data:/data
    ports:
      - "127.0.0.1:${DEMO_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_SYNC_DATABASE_URL: ${APP_SYNC_DATABASE_URL:?APP_SYNC_DATABASE_URL is required}
      APP_REDIS_BROKER_URL: ${APP_REDIS_BROKER_URL:?APP_REDIS_BROKER_URL is required}
      APP_REDIS_CACHE_URL: ${APP_REDIS_CACHE_URL:?APP_REDIS_CACHE_URL is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      TARGET_ORIGINS: ${TARGET_ORIGINS:?TARGET_ORIGINS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      demo-api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: ["python", "-m", "app.workers.dispatcher"]
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_SYNC_DATABASE_URL: ${APP_SYNC_DATABASE_URL:?APP_SYNC_DATABASE_URL is required}
      APP_REDIS_BROKER_URL: ${APP_REDIS_BROKER_URL:?APP_REDIS_BROKER_URL is required}
      APP_REDIS_CACHE_URL: ${APP_REDIS_CACHE_URL:?APP_REDIS_CACHE_URL is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      TARGET_ORIGINS: ${TARGET_ORIGINS:?TARGET_ORIGINS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  arp-db-data:
  demo-data:
